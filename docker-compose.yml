# Postgres local para desenvolvimento. Uso: copie .env.example para .env e rode `docker compose up -d`.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-stockmaster}
    ports:
      - "127.0.0.1:5432:5432"   # exposto apenas em localhost
    volumes:
      - stockmaster-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stockmaster-pgdata:
