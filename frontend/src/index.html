  <script>try{var t=localStorage.getItem("sm-theme");if(t==="system"||t==="auto"){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";localStorage.setItem("sm-theme",t)}document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light")}catch(e){}</script>
