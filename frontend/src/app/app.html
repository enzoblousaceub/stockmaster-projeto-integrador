<a class="skip-link" href="#main-content" (click)="skipToContent($event)">Pular para o conteúdo</a>

<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="Estoque Master, ir para o Dashboard">
      <img src="brand/mark-a.svg" class="brand-logo" alt="" width="32" height="32">
      <span class="brand-name">Estoque Master</span>
    </a>
    <span class="topbar-spacer"></span>
    <button type="button" class="icon-btn settings-btn--top" (click)="openSettings()"
      aria-label="Configurações" aria-haspopup="dialog">
      <mat-icon aria-hidden="true">settings</mat-icon>
    </button>
  </header>

  <nav class="nav" aria-label="Principal">
    <a class="nav-brand" routerLink="/" aria-label="Estoque Master, ir para o Dashboard">
      <img src="brand/mark-a.svg" class="brand-logo" alt="" width="28" height="28">
      <span class="brand-name">Estoque Master</span>
    </a>
    <ul class="nav-list">
      <li>
        <a class="nav-link" routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: true }" id="nav-dashboard">
          <mat-icon aria-hidden="true">dashboard</mat-icon>
          <span class="nav-label">Dashboard</span>
        </a>
      </li>
      <li>
        <a class="nav-link" routerLink="/products" [class.active]="productsActive()"
          [attr.aria-current]="productsActive() ? 'page' : null" id="nav-products">
          <mat-icon aria-hidden="true">inventory_2</mat-icon>
          <span class="nav-label">Produtos</span>
        </a>
      </li>
      <li>
        <a class="nav-link" routerLink="/products/new" routerLinkActive="active" ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: true }" id="nav-add-product">
          <mat-icon aria-hidden="true">add</mat-icon>
          <span class="nav-label">Novo produto</span>
        </a>
      </li>
    </ul>
    <button type="button" class="nav-link settings-btn--nav" (click)="openSettings()" aria-haspopup="dialog">
      <mat-icon aria-hidden="true">settings</mat-icon>
      <span class="nav-label">Configurações</span>
    </button>
  </nav>

  <main class="main" id="main-content" #main tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
